# JVM memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by the app's dependencies.
android.useAndroidX=true

# NOTE: do NOT enable org.gradle.parallel here. With Gradle 8.9 it triggers a
# Kotlin Gradle Plugin race ("Current thread does not hold the state lock for
# root project" while evaluating friendPathsSet), and this project is a single
# module so parallel execution provides no benefit anyway.

# Keep the daemon alive between builds.
org.gradle.daemon=true
